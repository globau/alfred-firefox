name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.3 (tagged as v0.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be in the form X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Assemble workflow
        run: |
          mkdir -p build dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o build/alfred-firefox .
          cp info.plist *.png LICENCE.txt README.md server.sh build/
          mkdir build/scripts build/icons
          cp scripts/* build/scripts/
          cp icons/*.png build/icons/
          /usr/libexec/PlistBuddy -c "Set :version $VERSION" build/info.plist
          name=$(/usr/libexec/PlistBuddy -c "Print :name" build/info.plist)
          echo "ASSET=dist/${name// /-}-$VERSION.alfredworkflow" >> "$GITHUB_ENV"

      - name: Package workflow
        working-directory: build
        run: zip -r "../$ASSET" . -x '.DS_Store'

      - name: Create release
        run: |
          gh release create "v$VERSION" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
